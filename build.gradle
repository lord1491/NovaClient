plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

// An empty jar is what you get when the .java files are not inside src/main/java/<package>/ (Gradle just says "NO-SOURCE").
// Fail loudly instead, so a jar with no classes can never be produced silently.
tasks.named('jar') {
    doFirst {
        if (!file('src/main/java/nova/NovaClient.java').exists())
            throw new GradleException('src/main/java/nova/NovaClient.java is missing - the source files must sit in src/main/java/nova/... (see README), otherwise the jar is empty and the mod never loads.')
        if (!file('src/main/resources/fabric.mod.json').exists())
            throw new GradleException('src/main/resources/fabric.mod.json is missing.')
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
